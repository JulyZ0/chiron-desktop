# 安全响应头片段 —— 由 nginx.conf 的 server 级与各静态 location `include`。
#
# ## 为什么必须是独立片段
#
# nginx 的 `add_header` 一旦在**子块**出现，就**完全覆盖父级**的同名指令集合。
# 所以任何自带 `add_header` 的 location（`= /index.html`、`/assets/`、字体、图片、
# `= /sw.js`、`/health`）都必须再 include 一次，否则那些响应会**丢失全部安全头**。
#
# 此前 `location = /index.html` 只带了 Cache-Control/Pragma/Expires，而 SPA 路由
# `location /` 的 `try_files` 正是内部重定向到它 —— 结果是**主页没有任何安全头**：
# 没有 CSP（全站失去 XSS 兜底）、没有 X-Frame-Options（任意站点可 iframe 嵌套做点击劫持）。

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# CSP：限制资源加载源，防止 XSS/数据注入。
#
# connect-src 已收窄到 'self' + ws/wss（**不再允许任意 https:**）—— 前端只与自身 API
# 通信，之前的 `https:` 通配等于给 XSS 留了一条任意外发通道（fetch 到攻击者域名带走
# token）。若后续要接第三方 API（如浏览器直连模型服务），请在此**显式列出域名**，
# 不要退回通配。
#
# img-src 仍保留 `https:`：对话里的 Markdown 外链图片需要能显示。若要彻底防外链数据
# 外泄，可收窄为 `'self' data: blob:`，代价是外链图片不再显示。
#
# ── 图形验证码（PRD H74 / 9.10）──────────────────────────────────────────────
#
# 验证码脚本、组件 iframe 与令牌回调是三处独立的 CSP 面：`script-src` 拦脚本、
# `frame-src` 拦组件本身（缺了它，就算脚本加载成功，验证码框也是空白）、
# `connect-src` 拦挑战/校验请求。三者必须**同时**放行，且只放行实际启用的服务商。
#
# 白名单的唯一事实来源是 `src/utils/captchaProviders.ts`：
# 本文件下面的 `# captcha-providers:` 声明与 CSP 指令由
# `src/utils/__tests__/captchaCspConsistency.spec.ts` 逐源比对，改一边不改另一边会红。
# 运行时开关同名：`VITE_CAPTCHA_PROVIDERS`（逗号分隔，未设置 = turnstile，空串 = 全关）。
#
# 各服务商**最小**放行集（不写通配，不写 https:）：
#   turnstile  script/frame/connect : https://challenges.cloudflare.com
#   recaptcha  script/frame/connect : https://www.google.com https://www.gstatic.com
#   hcaptcha   script              : https://js.hcaptcha.com
#              frame/connect       : https://js.hcaptcha.com https://newassets.hcaptcha.com
#   tencent    script              : https://ssl.captcha.qq.com
#              frame/connect       : https://ssl.captcha.qq.com https://turing.captcha.qcloud.com
#
# 换服务商时改这一行（部署实际启用谁，就只写谁；未启用的服务商不得出现其域名）：
# captcha-providers: turnstile
#
# CSS：`style-src 'self' 'unsafe-inline'` 是**必需的**，不是偷懒：
# ant-design-vue v4 走 cssinjs，组件样式由运行时插入 `<style>`（构建侧
# `AntDesignVueResolver({ importStyle: false })` 明确不产出组件 CSS）。
# `<style>` 元素归 style-src 管，只放 `style-src-attr` 会把它拦掉 ——
# 表现是 Docker/nginx Web 形态下**所有 antd 组件无样式**，而桌面端与网关托管
# SPA 的 CSP 本来就带 'unsafe-inline'，本机自测完全看不出来。
# 若以后改回构建期 CSS（importStyle: true）或接入 nonce，再把这一项收窄。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; frame-src 'self' blob: https://challenges.cloudflare.com;" always;
# HSTS：生产 HTTPS 部署启用（HTTP 下会被忽略）
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
