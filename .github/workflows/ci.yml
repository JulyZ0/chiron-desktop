name: CI

on:
  push:
    branches: [master]
    # 发布 tag 也要跑一遍：`release-preflight`（文件末尾）只在 tag / dispatch 下生效，
    # 而分支过滤会把 tag 推送整个挡掉。大小写都要 —— 本仓历史 tag 是**大写**
    # V0.1.<YYMMDD>.<NN>，与 desktop.yml 的触发条件保持同一口径。
    tags: ['v*', 'V*']
  pull_request:
  # 手动触发只为一件事：按**发布口径**跑 `release-preflight`
  # （= 全量 ci-smoke + 打包含产物检查），不发版、不出包 —— 出包在 desktop.yml。
  workflow_dispatch:
    inputs:
      release:
        description: '按发布口径跑 release-preflight（全量 ci-smoke + 打包含产物检查）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 同一分支的新推送取消旧的进行中运行，避免排队堆积
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Go 网关 ──────────────────────────────────────────────────────────────
  go:
    name: Go gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # `-mod=mod` 是必需的：仓库里的 vendor/ 放的是参考源码（vendor/DeepSeek-Reasonix，
      # 不含 vendor/modules.txt），Go 只要看到 vendor/ 就会按 vendor 模式做一致性检查
      # 并报 "inconsistent vendoring"。run.py / Makefile / Dockerfile 同样显式排除了它。
      - run: go build -mod=mod ./...
      - run: go vet -mod=mod ./...
      # live/diag 用例要**真机** PostgreSQL/Redis（由下面的 integration job 用 services 提供）。
      # 这里按测试名过滤：仓内 live 用例没有 //go:build 标记，靠"环境缺失即自跳过"，
      # 混在一起只会让"跳过"与"通过"分不清。口径与 scripts/ci-smoke.sh 一致。
      - name: Unit tests (live/diag excluded)
        run: go test -mod=mod ./internal/... ./config/... ./cmd/... -count=1 -skip 'Live|Diag'
      # 若仓库将来真的带 vendor/modules.txt，再跑一次 vendor 模式构建验证一致性；
      # 当前 vendor/ 只有参考源码（无 modules.txt），按"没有 vendor"跳过。
      - name: Vendor consistency (only when vendor/modules.txt exists)
        run: |
          if [ -f vendor/modules.txt ]; then
            go build -mod=vendor ./...
          else
            echo "no vendor/modules.txt —— 跳过 vendor 一致性检查"
          fi

  # ── Python 引擎 ─────────────────────────────────────────────────────────
  # job id 是 `engine`，对外显示名仍是 "Python engine"（分支保护按显示名匹配，
  # 改名不会让既有必需检查失效）。
  engine:
    name: Python engine
    runs-on: ubuntu-latest
    # ⚠ 起一个真 Redis：审批票（`submit_approval` / `_await_approval`）与一批 `live` 用例
    # 都依赖它 —— 没有 Redis 时 `approval ticket store failed (Redis URL not configured)`
    # ⇒ `submit_approval` 恒返回 False，`TestToolGuardConfirmPath` 的 3 条**核心逻辑**用例
    # （asked/decided 配对、批准续跑、拒绝报错）在 CI 上全红，而本机因为设了 `REDIS_URL`
    # 一直绿。这些不是"外部集成"，不该靠环境缺失来跳过。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    # ⚠ `app/config.py` 的 `Settings()` 在 **import 时**就校验 `JWT_SECRET`（≥32 字符，弱值被拒），
    # 而大量测试模块 import 引擎包 ⇒ 缺它会在**收集阶段**整片报错（不是"跑失败"而是"收集失败"，
    # 症状就是 `Interrupted: 184 errors during collection`，每条都写着同一句 JWT_SECRET 校验失败）。
    # 值与 `integration` job 分开，避免两处互相掩盖。
    env:
      APP_SECRET: ci-python-app-secret-0123456789abcdef
      JWT_SECRET: ci-python-jwt-secret-0123456789abcdef
      REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run:
        working-directory: python-engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 固定 3.14：与随包 python-runtime（runtime-install.cjs）和桌面工作流一致，
          # pyproject 的 requires-python 仍是 >=3.11。
          python-version: '3.14'
          cache: pip
          cache-dependency-path: python-engine/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # 测试与静态检查依赖统一走 requirements-dev.txt（与 pyproject 的 [dev] extra 对齐）。
          # 此前在 workflow 里手写 `pip install 'pytest>=8.4.0' 'ruff>=0.11.0'`，与两份清单各自漂移 ——
          # 依赖一旦有单一来源，加一个测试工具就只需改一处。
          python -m pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (strict)
        # 全量门禁：`mypy app/ acp_adapter/` 必须为 0（零 `type: ignore`、零新增豁免）。
        # 本机复核口径（2026-11-22）：0 / 334 文件。
        # 项目目标平台只有 Windows，pyproject 已把 platform 钉成 win32 ——
        # 因此 ctypes.WinDLL 等 Windows-only API 在 Linux runner 上也能正确解析；
        # 反过来，Linux-only 的分支（resource.setrlimit）按平台不可达处理。
        #
        # acp_adapter/ 是可选的 ACP 适配层（依赖不在主清单里），同样纳入门禁 ——
        # 可选依赖用 `# type: ignore[import-not-found]` 标注，不需要为了它改全局配置；
        # 反过来，不纳入门禁的代码迟早会腐烂。
        run: mypy app/ acp_adapter/
      - name: Pytest
        # 单测口径 = **稳定子集**（P2-13）：
        #   * `-m "not live and not integration and not network"` —— 零外部依赖：
        #     不连 Redis/PG、不发真实网络、不起监听端口的子进程。
        #     live/integration 留给下面的 real-stack job（那里有 service 容器 + 真实网关）；
        #     network 指"需要真实端口/网关"的用例（如 SDK 端到端、多进程沙箱服务），
        #     它们在本 job 里既没有网关也没有端口保证，混进来只会随机红。
        #   * `chiron_client` 缺失时由 tests/conftest.py 的 `collect_ignore_glob`
        #     自动排除 `test_chiron_client_sdk*.py`（该包在 clients/python/，本仓不含）。
        #     此前靠这里的 `--ignore-glob` 兜，但那只挡住 CI —— 本机仍会
        #     `Interrupted: 2 errors during collection`，一条用例都跑不了。
        run: >-
          python -m pytest tests -q
          -m "not live and not integration and not network"

  # ── 评测骨架（smoke 集）─────────────────────────────────────────────────
  #
  # PR 门禁：用**确定性替身 provider** 跑 smoke 集 —— 零密钥、零费用、可判定。
  # 这一步是 deepagents 都没有的：它的真实模型 eval 只在 workflow_dispatch 下触发
  # （libs/evals/.github/workflows/evals.yml:4）。
  #
  # 它验证的是「固件 → runner → 断言 → 报告」这条链路，因此**不需要任何第三方依赖**
  # 就能跑（httpx 已在 evals/submit.py 里改为延迟导入，只有 --submit http 才需要）。
  # **agent 能力必须用真实模型另跑**（`--submit http`，需网关 + 引擎；尚未接线）。
  evals:
    name: Evals (smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Smoke suite (scripted provider)
        # 退出码 0 = 全部通过 / 1 = 有任务失败，CI 直接可用
        run: python -m evals.cli run --suite smoke --submit scripted --report evals-report.json
      - name: Upload report
        # 失败时也要拿到报告（否则只能看日志里的摘要）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evals-smoke-report
          path: python-engine/evals-report.json
          if-no-files-found: warn

  # ── 前端 ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend-vue/pnpm-lock.yaml
      # registry 自动选择：与 Docker 构建同一套逻辑（frontend-vue/scripts/pick-registry.mjs），
      # 对候选源测速取最快者。NPM_CONFIG_REGISTRY 优先级高于 .npmrc，因此本机 .npmrc 里
      # 写死的 registry 不会影响 CI；全部不可达时兜底到官方源。
      - name: Pick fastest npm registry
        run: echo "NPM_CONFIG_REGISTRY=$(node scripts/pick-registry.mjs || echo https://registry.npmjs.org)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm run lint
      # 契约棘轮（z-index / 主题 token / 动效 token / i18n / a11y）。
      # 拆成显式步骤而不是 `pnpm run build`：这样失败时报的是**哪一档**红了。
      - name: UI contracts
        run: npm run check:ui
      - name: Typecheck (vue-tsc --noEmit)
        # **允许**存量错误 `src/api/index.ts` 的 IsolationHelperResult 族（P2 跟踪）。
        # 过滤只针对这一族：其余任何 `error TS` 都必须让门禁红 —— 否则 --noEmit 形同虚设。
        # 注意不能直接用 `vue-tsc -b`（npm run build 里的那份）：它把错误写进 buildinfo，
        # 第二次跑会"看起来通过"。
        run: |
          out="$(npx vue-tsc --noEmit -p tsconfig.app.json 2>&1 || true)"
          printf '%s\n' "$out"
          remaining="$(printf '%s\n' "$out" | grep 'error TS' | grep -v 'IsolationHelperResult' || true)"
          if [ -n "$remaining" ]; then
            echo "::error::vue-tsc 报出非 IsolationHelperResult 的类型错误"
            exit 1
          fi
      - name: Unit tests (fast subset)
        # 快速档：只跑**被改动最频繁、且跑得快**的目录（api/composables/config/router/
        # stores/utils，约 53 个 spec）。它的作用是让"明显打断"在 1~2 分钟内红，
        # 而不是等全量 5 分钟。**它不能替代全量** —— components/ 与 views/ 的用例
        # （102 个 spec）只有全量档才覆盖。
        run: >-
          npx vitest run
          src/api src/composables src/config src/router src/stores src/utils
          --reporter=dot
      - name: Unit tests (full)
        # 全量档：157 个 spec / 1600+ 用例。超时与并发口径见 frontend-vue/vitest.config.ts
        # （testTimeout 15s / hookTimeout 20s / pool=forks / maxWorkers=50%）——
        # 高负载下的 5s 超时抖动是**机器争用**，放宽等待上限是正解，不是把用例改绿。
        # `--reporter=json --outputFile.json` 供失败时上传（见下一步），
        # dot 保证日志可读，两者并存互不干扰。
        run: >-
          npx vitest run src
          --reporter=dot --reporter=json --outputFile.json=vitest-report.json
      - name: Upload vitest report
        # 只在失败时上传：绿的时候没人看这份 JSON，存它只是浪费存储与带宽。
        # `if-no-files-found: warn` —— 收集阶段就崩（配置写错）时报告文件不会生成，
        # 此时不让"上传"这一步再叠一个红，掩盖真正的错误。
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report
          path: frontend-vue/vitest-report.json
          if-no-files-found: warn
      # 打包静态冒烟：读 electron-builder.yml / main.cjs / web_static.go / router，
      # 断言「分享页可被网关托管、知识库与依赖页路由可达」。不需要 electron 本体。
      - name: Packaging smoke (static)
        run: node --test electron/__tests__/packaging.test.cjs
      - name: Vite build
        run: npx vite build

  # ── 桌面端本地栈（desktop-local + Electron 壳）──────────────────────────
  #
  # 这条线此前**完全没有 CI**：`desktop-local/` 的 289 条单测与
  # `frontend-vue/electron/__tests__/` 的 147 条纯 Node 单测都没人跑
  # （vitest 的 include 只有 `src/**`，够不到 `.test.cjs`）。
  # 后果是真实的：`smoke.test.cjs` 里有一条用例断言的是已被移除的
  # 「/healthz 回退」行为，在实现改成「只认 listening 事件」之后长期失效，
  # 却没有任何地方会红。
  #
  # 这里跑**不需要 PG** 的部分：单测把 PG 关掉（见 `tests/conftest.py`）。
  # Redis 例外 —— 它由下面的 service 提供（见该 job 的注释）。
  # 真实 PG 的集成 job 已随 `tests/integration/` 一并删除：业务层不复存在，
  # 引导器的 PG 行为由 `tests/test_pg_embedded.py` / `test_pg_unit.py` 覆盖。
  desktop-local:
    name: Desktop local
    runs-on: ubuntu-latest
    # tests/test_storage_redis.py 的两条契约用例要**真**起一次 Redis 并跑 PROBE_OPS。
    # runner 上既没有内置 redis 二进制（desktop-local/bin/redis 不随仓提交），
    # 也没有 CHIRON_LOCAL_REDIS_URL ⇒ 后端只能落到 fakeredis，而 fakeredis 不支持
    # EVAL ⇒ test_eval_verdict_matches_backend 必红。这与 `python` job 起 redis 的
    # 理由相同：不是"外部集成"，而是核心逻辑本身需要它。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 显式指向 service：RedisServer 的 backend 顺序是 server → bundled → fakeredis，
      # 只有给了 URL 才走第一档（真 Lua、真 Streams）。
      CHIRON_LOCAL_REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run:
        working-directory: desktop-local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: desktop-local/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Pytest
        # desktop-local 现在只剩数据栈引导器（launcher / config / storage / components）。
        # FastAPI 业务层与 tests/integration 已随 SaaS 域一起删除。
        run: python -m pytest -q
      # Electron 壳的纯 Node 单测：所有 Electron / spawn / fetch 都由
      # `components.cjs::_setDeps` 注入，因此不需要装 electron 本体。
      - name: Electron syntax check
        working-directory: frontend-vue/electron
        run: for f in *.cjs; do node --check "$f"; done
      - name: Electron unit tests
        working-directory: frontend-vue/electron
        run: node --test __tests__/*.test.cjs

  # ── 迁移链整体性 ─────────────────────────────────────────────────────────
  schema:
    name: Migration chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-migrate.txt
      # migrations/versions 必须只有**一个** head：分叉会让启动校验
      # （internal/db/schema_version.go 的 ParseMigrationHead）直接拒绝启动。
      - name: Single alembic head
        run: |
          out="$(python -m alembic -c alembic.ini heads)"
          echo "$out"
          count="$(printf '%s\n' "$out" | grep -c '(head)')"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 alembic head, found $count"
            exit 1
          fi
      # 迁移文件本身必须可被 Alembic 解析（离线模式不连库）。
      # ⚠ **离线渲染仍然需要"方言"**：本 job 没有 env、`alembic.ini` 的 `sqlalchemy.url`
      # 是注释状态、`migrations/env.py` 取不到 URL 就返回 None ⇒ alembic 直接抛
      # "Connection, url, or dialect_name is required."。**2026-10-09 本机实测：这一步按原样
      # 在 CI 里必然红**（exit 1）。下面给一个**假 DSN**：只用于确定方言，不会去连库；
      # 给了之后渲染出 81 个 CREATE TABLE / 164 个 ALTER TABLE、exit 0（同为本机实测）。
      - name: Migration renders offline
        env:
          DATABASE_DSN: postgresql://chiron:chiron@localhost:5432/chiron
        run: python -m alembic -c alembic.ini upgrade head --sql > /dev/null

  # ── 源码编码 ────────────────────────────────────────────────────────────
  encoding:
    name: Source encoding
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是注释卫生守卫的前提：它按"本次改动的行"判定，
      # 浅克隆（默认只取 1 层）拿不到 base 提交，diff 会失败。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      # U+FFFD / 非法 UTF-8 是**字节已损坏**的信号，不是排版问题：
      # python-engine/pyproject.toml 曾因此把 anthropic / pymilvus / prometheus-client
      # 三个依赖吞进注释行；frontend-vue/nginx.conf 则被吞掉 5 条配置指令
      # （client_max_body_size、location /assets/、location / 等），大括号失衡导致
      # frontend 容器直接起不来 —— 而前端 CI 只跑 dist 相关的 lint/build/test，全无察觉。
      - name: Encoding guard (U+FFFD / invalid UTF-8)
        run: python scripts/check_source_encoding.py
      # Go 侧（权威判定）与 Python 侧（保守镜像）的判定表**必须同构**。两者语言
      # 不同、无法共享代码，此前只有一行注释约定 —— 并且已经漂移过
      # （read_tool_result / list_subagent_runs / rerun_subagent）。见路线图 L3-9。
      # 2026-10-09 起**同时覆盖另外四族**：对话模式（Go `validAgentModes` ↔ 引擎
      # `AgentMode` 枚举 ↔ `_BASE_MODES` 覆盖，见 docs/session-runtime-spec.md §3）·
      # 模型服务提供商目录（Go `llmProviderCatalog` ↔ 引擎 `providers/catalog.py`，
      # 见 docs/service-providers.md §1）· 故障注入的作用面/类型（Go `chaosSupported*`
      # ↔ 引擎 `chaos/injector.py`，见 internal/api/ent_chaos_handler.go 文件头）·
      # **共享 Redis 键前缀**（`subagent:run:` / `subagent:cancel:ack:` / `engine:instance:`；
      # 两侧各自都有测试钉住自己那份字面量 ⇒ 只改一侧时容易两边都绿而漂移上线）·
      # **共享数值常量**（`defaultBranchKeepTail`/`minCondenseMessages` ↔ 引擎
      # `DEFAULT_KEEP_TAIL`/`MIN_COMPRESSIBLE_MESSAGES`，同一个陷阱）·
      # **工具授权模式**（唯一一条**三语言**约定：Go `mode.go` ↔ 引擎 `guards.py` ↔
      # 前端 `ChatView.vue` 的联合类型；做集合比对，只在一侧新增模式也会被拦下）。
      - name: Go-Python-TS parity (tables, modes, keys, constants)
        run: python scripts/check_tool_policy_parity.py
      # scripts/ 此前**没有任何 lint 门禁**（本 job 只跑上面两个守卫），于是攒下 8 处历史问题
      # （未用变量/未用导入/裸 except…），现已清零并纳入门禁。规则集与引擎一致（配置见仓库根
      # ruff.toml；python-engine 有自己的 pyproject.toml，就近优先，互不影响）。
      - name: Ruff (repo-root scripts)
        run: |
          pip install --quiet 'ruff>=0.11.0'
          ruff check scripts/
      # 注释卫生：**只查本次改动新增的行**，存量不碰 —— 否则一次清理就会变成
      # "改动即红"，护栏随即被关掉。error 级（分隔装饰线、无主 TODO）直接失败；
      # 长注释只 warn（顶层的模块/导出符号文档注释已豁免，那是 go doc 要读的）。
      # base 取 PR 的 base.sha 或 push 的 before，脚本内对孤儿提交有回退。
      - name: Comment hygiene (changed lines only)
        env:
          COMMENT_HYGIENE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_comment_hygiene.py --strict
      # 文档断链：Markdown 里被引用的文档必须存在。曾一次扫出 19 份**从未提交过**的设计文档
      # （注释里写着"见某份设计文档"，读者去找只会扑空）。**只扫 git 跟踪的 `.md`**：
      # 代码里的 'docs/xxx.md' 多是工具参数示例，扫进来只会误报。存量走基线白名单
      # （scripts/doc_link_baseline.txt，**只应缩小**），新增断链直接失败 —— 已用变异验证。
      - name: Doc links (referenced docs must exist)
        run: python scripts/check_doc_links.py
      # Markdown 表格结构：同一表格块内每行的列数必须一致。手写的表格**多一个 / 少一个 `|`
      # 不会让 Markdown 报错** —— 只是静默错位（看着"差不多"）。实测在
      # 某个长表格的 §3 抓到两处：一行多了一个分隔符、另一行少了行尾 `|`，
      # 而当时四个守卫没有一个覆盖这个类别。存量基线（scripts/md_tables_baseline.txt，
      # **只应缩小**）当前为**空** ⇒ 新增不一致直接失败（已做变异验证）。
      - name: Markdown tables (consistent column counts)
        run: python scripts/check_md_tables.py
      # 错误码键集：Go `Code*` 必须与三语言 `errors.ts` 的契约键一致，且三语言键集完全相同。
      # docs/error-codes.md 把这条写成**硬要求**，却自陈"目前靠人工核对" —— 缺一个键不会有
      # 任何报错，只有该语言的用户会看到未本地化的原文。存量基线为空（当前一致）。
      - name: Error code keys (Go Code* vs 3 locales)
        run: python scripts/check_error_code_keys.py
      # compose 必填环境变量必须有文档：`docker-compose.yml` 里用 `${VAR:?…}` 声明的变量
      # （compose 缺失时直接报错）必须在 `.env.example` 出现（**注释形态也算** —— 模板里
      # 可选/推荐项本来就是注释的）。判据是**先量过假阳性率**才定的：compose 引用了 29 个变量，
      # 但只有 **7** 个是 `:?`，其余 22 个都带 `:-默认值`（可选覆盖）；若要求"全部 29 个都要有文档"，
      # 会为 9 个**有默认值**的可选变量报假阳性（S3_BUCKET / MEMORY_VECTOR_BACKEND / MILVUS_ADDRESS …，
      # 而 `.env.example` 自己写明"业务/基础设施配置已迁移至后台「系统设置」"）—— 那种守卫会惩罚
      # **正确的文档**。已做变异验证（拿掉 `#JWT_SECRET=` ⇒ exit 1 并点名）。
      - name: Compose required env vars are documented
        run: python scripts/check_compose_env.py

  # ── 真实栈集成（L2-2）───────────────────────────────────────────────────────
  # 两侧的 live 测试此前都被永久跳过：Go 侧没有 CHIRON_TEST_POSTGRES_DSN，Python 侧
  # 只跑 -m "not integration" —— 覆盖支付入账/回退、设置持久化、工作流落库、统一
  # DB/Redis 客户端这些高风险路径的断言因此从未真正执行过。本 job 把它们跑起来：
  #   * PostgreSQL / Redis 用 services 起（compose 里没有 PG，故自建）；
  #   * schema 用 alembic 建 —— 与发布流程同一个入口，顺带验证迁移在空库上能跑通；
  #   * Python 的 UnifiedDBClient / UnifiedRedisClient 走的是 Go 网关的
  #     /v1/internal/{db,redis}/*，所以网关也要拉起来（build 后后台跑，等 /health）；
  #   * APP_SECRET 必须 ≥32 字符，否则网关拒绝启动（internal/config 的 fail fast）。
  integration:
    name: Real-stack integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chiron
          POSTGRES_PASSWORD: chiron
          POSTGRES_DB: chiron
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chiron -d chiron"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 同一份 DSN 喂三处：网关（POSTGRES_DSN）、alembic（DATABASE_DSN 优先）、Go live 测试
      POSTGRES_DSN: postgresql://chiron:chiron@127.0.0.1:5432/chiron
      DATABASE_DSN: postgresql://chiron:chiron@127.0.0.1:5432/chiron
      CHIRON_TEST_POSTGRES_DSN: postgresql://chiron:chiron@127.0.0.1:5432/chiron
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_SECRET: ci-integration-app-secret-0123456789abcdef
      JWT_SECRET: ci-integration-jwt-secret-0123456789abcdef
      INTERNAL_TOKEN: ci-integration-internal-token-0123456789
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Apply schema (alembic upgrade head)
        run: |
          python -m pip install -r requirements-migrate.txt
          python -m alembic -c alembic.ini upgrade head

      - name: Go live tests (real PostgreSQL + Redis)
        # -run 只挑真实库用例（Live/Diag）：其余用例与 go job 重复，不必再跑一遍
        # broadcast：断线重放/跨实例补发；engine：session→实例归属（审批/取消路由依据）；
        # 两者都走 REDIS_URL，此前没有真实 Redis 覆盖（内部差距分析 切口 #1）。
        run: go test -mod=mod ./internal/api/... ./internal/settings/... ./internal/broadcast/... ./internal/engine/... -count=1 -run 'Live|Diag' -v

      - name: Build and start gateway
        run: |
          go build -mod=mod -o /tmp/chiron ./cmd/chiron
          /tmp/chiron > /tmp/gateway.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              echo "gateway is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "::error::gateway did not become healthy in 30s"
          tail -50 /tmp/gateway.log
          exit 1

      - name: Install engine deps
        working-directory: python-engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Python integration tests (real stack)
        working-directory: python-engine
        # `live` = 只需真实依赖(本 job 有 Redis)、不需 PG 的用例（如 KeyRing 的 Lua 脚本
        # test_key_ring_live.py）；它们被单测 job 的 `-m "not integration"` 收集时，因无
        # REDIS_URL 会即时 skip、不发起连接，所以放这里连同 integration 一起跑最省。
        # `network` = 需要真实端口/网关的用例（SDK 端到端、多进程沙箱服务）。单测 job
        # 已用稳定子集把它们排除（那里没有网关、端口也不保证），**必须**在这里收回来跑，
        # 否则它们会从"偶发红"变成"从不跑"—— 后者更糟，因为没人会察觉。
        run: python -m pytest -q -m "integration or live or network"

      - name: Cross-instance drill (two gateway processes)
        # **两个真实网关进程** + Redis：跨实例扇出、实时不重复、断线重连补发不重复。
        # 此前这一格只有"进程内双 hub"用例（internal/api/sse_cross_instance_live_test.go）——
        # 2026-10-08 正是这个演练挖出了"多实例重复投递"缺陷（实时与重放都 N 份）。
        # 用上面已构建好的 /tmp/chiron，不再重复编译。
        working-directory: python-engine
        run: python tests/drills/multi_instance_drill.py /tmp/chiron

  # ── 发布前置（P2-12）────────────────────────────────────────────────────
  #
  # 只在**发布口径**下跑：tag 推送（v*/V*）或 workflow_dispatch 勾 release=true。
  # 它不发布任何东西 —— 出包与上传由 desktop.yml 负责；这里的价值是把
  # 「各分片都绿」换成「用户实际会跑的那条命令是绿的」：
  #
  #   * PR 门禁是**分片**（每个 job 一条），分片全绿而 `scripts/ci-smoke.sh`
  #     本身坏掉（参数、路径、顺序、marker 口径）是真实发生过的失效类别；
  #   * 产物形状单独再钉一次：dist 存在、dist→resources/web 的复制配置在、
  #     `chiron.exe` 真能建出来。这三项任何一项静默失效，装出来的都是**残包**
  #     （用户侧表现为"分享链接 404 / 哪都点不动"），而分片门禁全绿。
  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    # 稳定子集里仍有一批**核心逻辑**依赖 Redis（审批票 submit_approval、
    # KeyRing 的 Lua 仲裁）。与 engine / desktop-local job 起同一个 service：
    # 没有它，`TestToolGuardConfirmPath` 会因"票据存不进"整片红 —— 那是环境缺失，
    # 不是集成测试，所以不该在发布门禁里"跳过"。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      # APP_SECRET / JWT_SECRET 由 ci-smoke.sh 自带默认值（32+ 字符），这里不重复设。
    # `github.event.inputs.release` 是**字符串**（workflow_dispatch 的布尔输入序列化后
    # 也是 "true"/"false"），所以与字面量比较，不要写 `inputs.release`。
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/V') ||
      github.event.inputs.release == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend-vue/pnpm-lock.yaml

      - uses: actions/setup-python@v7
        with:
          # 与 engine job 同口径（3.14）
          python-version: '3.14'
          cache: pip
          cache-dependency-path: python-engine/requirements-dev.txt

      - name: Install frontend deps
        working-directory: frontend-vue
        run: |
          echo "NPM_CONFIG_REGISTRY=$(node scripts/pick-registry.mjs || echo https://registry.npmjs.org)" >> "$GITHUB_ENV"
          pnpm install --frozen-lockfile

      - name: Install engine deps
        working-directory: python-engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Full smoke (bash scripts/ci-smoke.sh)
        # 全量口径：go + schema + engine（CI 下即全量单测）+ frontend 全量。
        # 这一条是**发布门禁的硬前提** —— 下面两项只是它没覆盖到的产物形状。
        run: bash scripts/ci-smoke.sh

      - name: Packaging smoke (static)
        # 单独再跑一遍是有意的：ci-smoke 的 --fast 也包含这一步，而这里要的是
        # "即使有人改了 ci-smoke 的顺序，打包断言仍然被执行"。
        run: node --test frontend-vue/electron/__tests__/packaging.test.cjs

      - name: Build bundled Go gateway (chiron.exe)
        # 显式把 platform 钉成 win32：`buildGateway` 默认按**runner** 平台决定产物名
        # （Linux 上会叫 `chiron`），而安装包要的是 `chiron.exe`。钉 platform 而不是
        # 手写 `go build`：产物参数（-mod=mod / -ldflags / CGO_ENABLED=0）与真实的
        # 出包路径保持单一来源，否则"门禁建出来的二进制"和"装包里的二进制"不是一回事。
        working-directory: frontend-vue
        run: >-
          node --input-type=module -e "import { pathToFileURL } from 'node:url';
          import { resolve } from 'node:path';
          const mod = await import(pathToFileURL(resolve('scripts/build-gateway.mjs')).href);
          const built = mod.buildGateway({ platform: 'win32', goos: 'windows', goarch: 'amd64' });
          console.log('ok', built.output, built.size + ' bytes');"

      - name: Assert release artifacts
        # 全部是**正向断言**（缺了就红），理由与 desktop.yml 的同名步骤一致：
        # electron-builder 对匹配不到的 extraResources 只 warn 不报错，产物照样"成功"。
        shell: bash
        run: |
          fail=0

          if [ -s frontend-vue/dist/index.html ]; then
            echo "ok  frontend-vue/dist/index.html"
          else
            echo "::error::缺少 frontend-vue/dist/index.html —— 前端产物没建出来，安装包会是白屏"
            fail=1
          fi

          # dist → resources/web：网关是独立 Go 进程，打不开 asar，只能读真实目录；
          # 少了这一份 /s/<token> 分享链接在任何浏览器里都 404。
          if awk '/^extraResources:/{f=1} f && /from: dist/{d=1} f && d && /to: web/{w=1} END{exit !(d && w)}' \
              frontend-vue/electron-builder.yml; then
            echo "ok  electron-builder.yml: extraResources dist -> web"
          else
            echo "::error::electron-builder.yml 缺少 extraResources 的 from: dist / to: web"
            fail=1
          fi
          # 壳层按 process.resourcesPath/web 定位，两侧路径必须一致（main.cjs 的 resolveWebRoot）
          if grep -q "resourcesPath" frontend-vue/electron/main.cjs \
              && grep -q "'web'" frontend-vue/electron/main.cjs; then
            echo "ok  main.cjs: resolveWebRoot 定位 resources/web"
          else
            echo "::error::main.cjs 不再按 process.resourcesPath/'web' 定位前端产物"
            fail=1
          fi

          # 网关：本地模式的唯一业务入口。缺了壳会静默退回 desktop-local core，
          # 用户看到的是"Windows 桌面端几乎什么都用不了"，而 CI 全绿。
          gateway=frontend-vue/assets/gateway/chiron.exe
          if [ -s "$gateway" ]; then
            echo "ok  $gateway $(wc -c < "$gateway") bytes"
          else
            echo "::error::缺少 $gateway（或它是空文件）—— 安装包没有业务入口"
            fail=1
          fi

          exit "$fail"
